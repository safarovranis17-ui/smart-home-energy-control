<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Умный дом - Автоматический мониторинг</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: bold; color: #667eea; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .live-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
            animation: pulse 1s infinite;
            margin-left: 10px;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .footer { text-align: center; color: white; padding: 20px; }
        .last-record {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
        h3 { margin: 0 0 15px 0; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Система контроля энергопотребления</h1>
            <p>Автоматическое воспроизведение данных из CSV</p>
            <span class="live-badge"></span> <span id="status-text">Подключение...</span>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card"><div class="stat-value">--</div><div>Среднее</div></div>
            <div class="stat-card"><div class="stat-value">--</div><div>Максимум</div></div>
            <div class="stat-card"><div class="stat-value">--</div><div>Минимум</div></div>
            <div class="stat-card"><div class="stat-value">--</div><div>Всего</div></div>
        </div>
        
        <div class="chart-container">
            <h3>📊 Динамика энергопотребления</h3>
            <div id="chart" style="height: 400px;"></div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progress-text">Ожидание данных...</div>
        </div>
        
        <div class="last-record" id="last-record">
            Ожидание данных с сервера...
        </div>
        
        <div class="footer">
            <p>© 2024 Система умного дома | Данные автоматически поступают из CSV</p>
        </div>
    </div>
    
    <script>
        let socket = io();
        let chartData = [];
        let chart = null;
        let allEnergies = [];  // Для статистики
        
        socket.on('connect', function() {
            console.log('✅ WebSocket подключен');
            document.getElementById('status-text').innerHTML = 'Соединено, данные поступают...';
        });
        
        socket.on('new_data', function(data) {
            console.log('📊 Новые данные:', data);
            
            // Добавляем точку на график
            chartData.push({
                time: data.datetime_short,
                energy: data.energy
            });
            
            // Оставляем последние 200 точек
            if (chartData.length > 200) {
                chartData.shift();
            }
            
            // Обновляем график
            updateChart();
            
            // Обновляем прогресс
            document.getElementById('progress-fill').style.width = data.progress + '%';
            document.getElementById('progress-text').innerHTML = `Воспроизведено ${data.current} из ${data.total} (${data.progress.toFixed(1)}%)`;
            
            // Обновляем последнюю запись
            document.getElementById('last-record').innerHTML = `
                <strong>Последняя запись:</strong> ${data.datetime} | 
                <strong>Энергия:</strong> ${data.energy.toFixed(2)} кВт·ч |
                <strong>Приборы:</strong> 📺=${data.television} 🔥=${data.dryer} 🍳=${data.oven} 🧊=${data.refrigerator} ⚡=${data.microwave}
            `;
        });
        
        socket.on('playback_finished', function() {
            console.log('✅ Воспроизведение завершено');
            document.getElementById('status-text').innerHTML = 'Воспроизведение завершено!';
        });
        
        function updateChart() {
            if (chartData.length === 0) return;
            
            const trace = {
                x: chartData.map(d => d.time),
                y: chartData.map(d => d.energy),
                mode: 'lines+markers',
                name: 'Энергопотребление',
                line: { color: '#667eea', width: 2 },
                marker: { size: 4, color: '#667eea' }
            };
            
            const layout = {
                title: '',
                xaxis: { title: 'Время', tickangle: -45 },
                yaxis: { title: 'Энергопотребление (кВт·ч)' }
            };
            
            if (chart === null) {
                Plotly.newPlot('chart', [trace], layout, { responsive: true });
                chart = true;
            } else {
                Plotly.react('chart', [trace], layout);
            }
        }
        
        async function loadInitialData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    // Заполняем график первыми 100 точками
                    chartData = data.slice(0, 100).map(d => ({
                        time: d.Datetime.substring(5, 16),
                        energy: d['Energy Consumption (kWh)']
                    }));
                    updateChart();
                    
                    // Статистика по всем данным
                    const allEnergies = data.map(d => d['Energy Consumption (kWh)']);
                    const avg = (allEnergies.reduce((a,b) => a+b, 0) / allEnergies.length).toFixed(2);
                    const max = Math.max(...allEnergies).toFixed(2);
                    const min = Math.min(...allEnergies).toFixed(2);
                    
                    document.getElementById('stats').innerHTML = `
                        <div class="stat-card"><div class="stat-value">${avg}</div><div>Среднее (кВт·ч)</div></div>
                        <div class="stat-card"><div class="stat-value">${max}</div><div>Максимум (кВт·ч)</div></div>
                        <div class="stat-card"><div class="stat-value">${min}</div><div>Минимум (кВт·ч)</div></div>
                        <div class="stat-card"><div class="stat-value">${data.length}</div><div>Всего записей</div></div>
                    `;
                }
            } catch(e) {
                console.error('Ошибка загрузки:', e);
            }
        }
        
        // Загружаем начальные данные
        loadInitialData();
        
        // Обновляем статус каждые 2 секунды
        setInterval(async function() {
            try {
                const resp = await fetch('/api/status');
                const status = await resp.json();
                if (status.is_playing) {
                    document.getElementById('status-text').innerHTML = '🟢 Данные поступают...';
                }
            } catch(e) {}
        }, 2000);
    </script>
</body>
</html>
